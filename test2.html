<!doctype html><html><head><meta charset="utf-8"><title>ocr-test</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head><body><canvas id="cv" width="1280" height="720"></canvas>
<script>
// Representative quiz-screen renderer (adapted from the app test harness mock)
var cv = document.getElementById("cv"), c = cv.getContext("2d");
var LINES = {
  T1: ["What is the capital of France?", "A) Madrid", "B) Paris", "C) Rome", "D) Berlin"],
  T2: ["Which planet is known as the Red Planet?", "A) Mars", "B) Venus", "C) Jupiter", "D) Mercury"],
  T4: ["A train covers 60 km in 45 minutes.", "What is its average speed?", "A) 60 km/h", "B) 75 km/h", "C) 80 km/h", "D) 90 km/h"],
  T3: ["Which planet is known as the Red Planet?", "A) Mars", "B) Venus", "C) Saturn", "D) Mercury"],
  T5: ["Which of these is NOT a fruit?", "A) Apple", "B) Banana", "C) Carrot", "D) Orange"],
  T6: ["What is the capital of France?", "A) Madrid", "B) Paris", "C) Rome", "~~D~~"],
  T7: ["A train covers 60 km in ~~45~~ minutes.", "What is its average speed?", "A) 60 km/h", "B) 75 km/h", "C) 80 km/h", "D) 90 km/h"]
};
// "~~x~~" renders x at very low alpha (simulates glare-washed / low-contrast content)
function mulberry(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
var noiseFrames = [];
for (var nf = 0; nf < 4; nf++){
  var nc = document.createElement("canvas"); nc.width = 320; nc.height = 180;
  var nctx = nc.getContext("2d");
  var nid = nctx.createImageData(320, 180);
  var nrnd = mulberry(777 + nf);
  for (var np = 0; np < nid.data.length; np += 4){
    if (nrnd() < 0.06){ var nv = 128 + Math.floor((nrnd()-0.5)*160); nid.data[np]=nid.data[np+1]=nid.data[np+2]=nv; nid.data[np+3]=255; }
  }
  nctx.putImageData(nid, 0, 0); noiseFrames.push(nc);
}
function draw(scene, opts){
  opts = opts || {};
  var blur = opts.blur || 0, jitter = opts.jitter || 0, glare = !!opts.glare, skew = opts.skew || 0, tick = opts.tick;
  c.save();
  c.filter = blur > 0.05 ? "blur(" + blur.toFixed(2) + "px)" : "none";
  if (skew){ c.translate(640, 360); c.rotate(skew); c.translate(-640, -360); }
  var amp = 1.5 + jitter, jx = (Math.random()*2-1)*amp, jy = (Math.random()*2-1)*amp;
  c.translate(jx, jy);
  c.fillStyle = "#101418"; c.fillRect(-80, -80, 1440, 880);
  c.fillStyle = "#1c2530"; c.fillRect(100, 60, 1080, 600);
  var lines = LINES[scene];
  c.font = "34px sans-serif";
  if (opts.highlight){
    c.fillStyle = "#1d7a3f";   // answer-feedback tint behind option A, text unchanged
    c.fillRect(140, 170 + 1 * 80 - 30, 780, 44);
  }
  for (var li = 0; li < lines.length; li++){
    var parts = lines[li].split(/(~~.*?~~)/g);
    var x = 160;
    for (var pi = 0; pi < parts.length; pi++){
      var ptxt = parts[pi], faint = false;
      if (ptxt.slice(0,2) === "~~"){ faint = true; ptxt = ptxt.slice(2, -2); }
      c.fillStyle = faint ? "rgba(232,238,242,0.14)" : "#e8eef2";
      c.fillText(ptxt, x, 170 + li * 80);
      x += c.measureText(ptxt).width;
    }
  }
  c.font = "16px sans-serif";
  c.fillText(tick != null ? tick : "0:" + String(Math.floor(performance.now()/1000)%60).padStart(2,"0"), 1100, 110);
  if (glare){
    var g = c.createLinearGradient(300, 0, 900, 720);
    g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(0.5, "rgba(255,255,255,0.35)"); g.addColorStop(1, "rgba(255,255,255,0)");
    c.fillStyle = g; c.fillRect(-80, -80, 1440, 880);
  }
  c.restore();
  c.save(); c.filter = "none";
  var fl = Math.sin(Date.now()/530) * 0.02;
  c.fillStyle = fl >= 0 ? "rgba(255,255,255," + fl.toFixed(3) + ")" : "rgba(0,0,0," + (-fl).toFixed(3) + ")";
  c.fillRect(0, 0, 1280, 720);
  c.globalAlpha = 0.10; c.drawImage(noiseFrames[Math.floor(Math.random()*4)], 0, 0, 1280, 720);
  c.restore();
}
function normTok(s){ return (s||"").toLowerCase().replace(/[^a-z0-9:.\/]+/g, " ").trim(); }
/* Structured extraction: question + contiguous options. REJECTS anything incomplete. */
function extract(txt){
  var t = (txt || "").replace(/\s+/g, " ").trim();
  var re = /([A-E])\s*\)\s*/g, m, marks = [];
  while ((m = re.exec(t))) marks.push({ letter: m[1], start: m.index, end: re.lastIndex });
  if (marks.length < 2) return { ok: false, reason: "option markers found: " + marks.length };
  var seq = "ABCDE", s0 = seq.indexOf(marks[0].letter);
  if (s0 < 0) return { ok: false, reason: "bad first marker" };
  for (var i = 0; i < marks.length; i++){
    if (marks[i].letter !== seq[s0 + i]) return { ok: false, reason: "option sequence broken at " + marks[i].letter + " (found " + marks.map(function(x){return x.letter}).join("") + ")" };
  }
  var question = t.slice(0, marks[0].start).trim();
  var options = {};
  for (i = 0; i < marks.length; i++){
    var end = i + 1 < marks.length ? marks[i + 1].start : t.length;
    var ot = t.slice(marks[i].end, end).trim();
    if (ot.length < 2) return { ok: false, reason: "option " + marks[i].letter + " text missing/garbled" };
    options[marks[i].letter] = ot;
  }
  // require at least one digit-preserving consistency: question must be a real sentence fragment
  if (normTok(question).length < 8) return { ok: false, reason: "question text too short/garbled" };
  return { ok: true, question: normTok(question), options: options };
}
/* Signature for dedup: stable question tokens (across 2 frames) + strict options.
   Clock-pattern tokens are always excluded; other unstable tokens drop out naturally.
   No positional cropping: nothing spatial is assumed about the timer. */
function signature(ex1, ex2){
  var q1 = ex1.question.split(" "), q2 = {}, stable = [];
  ex2.question.split(" ").forEach(function(w){ q2[w] = true; });
  q1.forEach(function(w){
    if (/^\d{1,2}:\d{2}$/.test(w)) return;      // clock pattern: always excluded
    if (q2[w]) stable.push(w);
  });
  var optKeys = Object.keys(ex1.options).sort();
  var opts = optKeys.map(function(k){ return k + ")" + normTok(ex1.options[k]); });
  return stable.join(" ") + " || " + opts.join(" ");
}
window.__testResult = null;
(async function(){
  var R = { cases: [], error: null };
  try {
    var worker = await Tesseract.createWorker("eng");
    async function ocr2(name, scene, opts){
      draw(scene, opts);
      var r1 = await worker.recognize(cv);
      draw(scene, opts);                      // fresh frame: new noise/jitter, timer may tick
      var r2 = await worker.recognize(cv);
      var e1 = extract(r1.data.text), e2 = extract(r2.data.text);
      var rec = { name: name, frame1: e1, frame2: e2 };
      if (e1.ok && e2.ok){
        rec.signature = signature(e1, e2);
        rec.stable = e1.question.split(" ").filter(function(w){ return e2.question.indexOf(w) >= 0; }).length + "/" + e1.question.split(" ").length + " q-tokens stable";
      }
      R.cases.push(rec);
      return rec;
    }
    await ocr2("T1-clean", "T1", {blur: 0.5, tick: "0:07"});
    await ocr2("T4-arithmetic", "T4", {blur: 0.5, tick: "0:08"});
    await ocr2("T5-negation", "T5", {blur: 0.5, tick: "0:09"});
    await ocr2("T1-glare", "T1", {blur: 0.5, glare: true, tick: "0:10"});
    await ocr2("T6-faint-option-D", "T6", {blur: 0.5, tick: "0:11"});
    await ocr2("T7-faint-number", "T7", {blur: 0.5, tick: "0:12"});
    var h = await ocr2("T1-highlight-A", "T1", {blur: 0.5, highlight: true, tick: "0:13"});
    var s2 = await ocr2("T3-edited-option", "T3", {blur: 0.5, tick: "0:14"});
    // dedup verdicts vs the T1-clean signature
    var base = R.cases[0];
    R.dedup = {
      highlightSameAsBase: !!(base.signature && h.signature && base.signature.replace(/0:\d\d/g,"") === h.signature.replace(/0:\d\d/g,"")),
      editedDiffersFromT2: null
    };
    // T2 reference vs T3 edited option (sparse legit edit)
    var t2 = await ocr2("T2-reference", "T2", {blur: 0.5, tick: "0:15"});
    R.dedup.editedDiffersFromT2 = !!(t2.signature && s2.signature && t2.signature !== s2.signature);
    await worker.terminate();
    R.done = true;
  } catch (e){ R.error = String((e && e.message) || e); }
  window.__testResult = R;
})();
</script></body></html>
